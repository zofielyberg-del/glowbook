<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <style>
    .glow-letter {
      fill: #000000;
    }
    @media (prefers-color-scheme: dark) {
      .glow-letter {
        fill: #ffffff;
      }
    }
  </style>

  <!-- Clean, ultra-minimalist 'G' and 'b' perfectly balanced -->
  <g transform="translate(48, 12)">
    <!-- 'G' in Black/White depending on system theme -->
    <text x="50" y="340" font-family="'Comfortaa', 'Outfit', -apple-system, sans-serif" font-size="290" font-weight="900" class="glow-letter" letter-spacing="-8">G</text>
    <!-- 'b' in Champagne Gold -->
    <text x="210" y="340" font-family="'Comfortaa', 'Outfit', -apple-system, sans-serif" font-size="290" font-weight="400" fill="#C5A059" letter-spacing="-8">b</text>
  </g>
</svg>
