<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Circular background badge - super clean and modern -->
  <rect width="512" height="512" rx="140" fill="#ffffff" stroke="#f0f0f0" stroke-width="8" />

  <!-- The Interlocking 'G' and 'b' -->
  <g transform="translate(8, 0)">
    <!-- 'G' in Black -->
    <text x="110" y="350" font-family="'Comfortaa', 'Outfit', -apple-system, sans-serif" font-size="280" font-weight="900" fill="#000000" letter-spacing="-5">G</text>
    <!-- 'b' in Champagne Gold -->
    <text x="265" y="350" font-family="'Comfortaa', 'Outfit', -apple-system, sans-serif" font-size="280" font-weight="400" fill="#C5A059" letter-spacing="-5">b</text>
  </g>

  <!-- Luxury Diamond Spark at the top right to represent "Glow" -->
  <path d="M 370 140 Q 400 170 430 140 Q 400 110 370 140 Z" fill="#C5A059" />
  <path d="M 370 140 Q 400 170 430 140 Q 400 110 370 140 Z" fill="#C5A059" transform="rotate(90, 400, 140)" />
</svg>
