<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <style>
    .badge-bg {
      fill: #ffffff;
      stroke: #f0f0f0;
    }
    .glow-letter {
      fill: #000000;
    }
    @media (prefers-color-scheme: dark) {
      .badge-bg {
        fill: #000000;
        stroke: #1a1a1a;
      }
      .glow-letter {
        fill: #ffffff;
      }
    }
  </style>

  <!-- Dynamic theme-aware background badge -->
  <rect width="504" height="504" x="4" y="4" rx="140" class="badge-bg" stroke-width="8" />

  <!-- The Interlocking 'G' and 'b' -->
  <g transform="translate(8, 0)">
    <!-- 'G' in Black/White depending on system theme -->
    <text x="110" y="350" font-family="'Comfortaa', 'Outfit', -apple-system, sans-serif" font-size="280" font-weight="900" class="glow-letter" letter-spacing="-5">G</text>
    <!-- 'b' in Champagne Gold (book style) -->
    <text x="265" y="350" font-family="'Comfortaa', 'Outfit', -apple-system, sans-serif" font-size="280" font-weight="400" fill="#C5A059" letter-spacing="-5">b</text>
  </g>

  <!-- Luxury Diamond Spark at the top right to represent "Glow" -->
  <path d="M 370 140 Q 400 170 430 140 Q 400 110 370 140 Z" fill="#C5A059" />
  <path d="M 370 140 Q 400 170 430 140 Q 400 110 370 140 Z" fill="#C5A059" transform="rotate(90, 400, 140)" />
</svg>
