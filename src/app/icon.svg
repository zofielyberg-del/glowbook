<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <style>
    .glow-letter {
      fill: #000000;
    }
    @media (prefers-color-scheme: dark) {
      .glow-letter {
        fill: #ffffff;
      }
    }
  </style>

  <!-- Single, iconic, perfectly centered 'G' representing "Glow" -->
  <text x="50%" y="360" text-anchor="middle" font-family="'Comfortaa', 'Outfit', -apple-system, sans-serif" font-size="340" font-weight="900" class="glow-letter">G</text>
</svg>
